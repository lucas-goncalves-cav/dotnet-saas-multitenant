services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?set SQL_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # The container reports healthy long before SQL Server accepts logins,
      # so the check is an actual query rather than a port probe.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=${SQL_DATABASE:-SaasMultiTenant};User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-saas-multitenant}
      Jwt__Audience: ${JWT_AUDIENCE:-saas-multitenant}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      Database__MigrateOnStartup: "true"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  sqlserver-data:
